name: Release ZIP

# Builds scent_assistant.zip from the release's tag and attaches it, so
# HACS (zip_release in hacs.json) installs it and GitHub counts downloads.
# Run it by hand with a tag to (re)attach the ZIP to an existing release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the ZIP for
        required: true

permissions:
  contents: write

jobs:
  zip:
    name: Build and attach ZIP
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build ZIP
        working-directory: custom_components/scent_assistant
        run: zip -r -X "$RUNNER_TEMP/scent_assistant.zip" . -x '__pycache__/*' '*.pyc'
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/scent_assistant.zip" --clobber
